name: Gerar APK Android (SCI Enfermagem)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependências e gerar APK
        run: |
          if [ -f "sci_app/pubspec.yaml" ]; then
            cd sci_app
          fi
          flutter pub get
          flutter build apk --release

      - name: Disponibilizar APK para Download (SCI-Enfermagem-APK)
        uses: actions/upload-artifact@v4
        with:
          name: SCI-Enfermagem-APK
          path: |
            sci_app/build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
